<!-- ROTEAMENTO E LÓGICA FRONTEND -->
<script>
    // Inicializa ícones na carga inicial
    lucide.createIcons();

    // Roteador de Telas da SPA
    function navigate(view) {
        const views = ['landing', 'login', 'dashboard', 'produtos', 'relatorios'];
        
        views.forEach(v => {
            const element = document.getElementById(`view-${v}`);
            if (element) element.classList.add('hidden');
        });

        const targetView = document.getElementById(`view-${view}`);
        if (targetView) targetView.classList.remove('hidden');

        // Re-inicializa ícones Lucide para garantir renderização de elementos visíveis
        lucide.createIcons();

        if (view === 'dashboard') {
            renderChart();
        }
    }

    // Login Simulado
    function handleLogin(e) {
        e.preventDefault();
        triggerToast("Login efetuado com sucesso!");
        navigate('dashboard');
    }

    // Sistema de Notificações Toast
    function triggerToast(msg) {
        const toast = document.getElementById('toast');
        document.getElementById('toast-message').innerText = msg;
        toast.classList.remove('translate-x-full');
        setTimeout(() => {
            toast.classList.add('translate-x-full');
        }, 3000);
    }

    // Instância do Gráfico Chart.js
    let chartInstance = null;
    function renderChart() {
        const ctx = document.getElementById('dashboardChart');
        if (!ctx) return;

        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'],
                datasets: [
                    {
                        label: 'Entradas',
                        data: [15, 22, 10, 18, 12, 25, 30],
                        borderColor: '#22c55e',
                        tension: 0.3
                    },
                    {
                        label: 'Saídas',
                        data: [8, 14, 12, 6, 15, 10, 18],
                        borderColor: '#ef4444',
                        tension: 0.3
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { color: '#F8FAFC' } }
                },
                scales: {
                    x: { ticks: { color: '#94A3B8' }, grid: { color: '#334155' } },
                    y: { ticks: { color: '#94A3B8' }, grid: { color: '#334155' } }
                }
            }
        });
    }
</script>
